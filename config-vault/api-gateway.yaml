server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Product Service
            - id: product-service-wildcard
              uri: lb://product-service
              predicates:
                - Path=/api/product/**
            - id: product-service-exact
              uri: lb://product-service
              predicates:
                - Path=/api/product

            # Category Service
            - id: category-service-wildcard
              uri: lb://product-service
              predicates:
                - Path=/api/category/**
            - id: category-service-exact
              uri: lb://product-service
              predicates:
                - Path=/api/category

            # Order Service
            - id: order-service-wildcard
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
            - id: order-service-exact
              uri: lb://order-service
              predicates:
                - Path=/api/order

            # Inventory Service
            - id: inventory-service-wildcard
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
            - id: inventory-service-exact
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    registerWithEureka: true
    fetchRegistry: true