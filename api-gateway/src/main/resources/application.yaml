server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/product, /api/product/**, /api/category, /api/category/**

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory, /api/inventory/**

            - id: eureka-server
              uri: http://localhost:8761
              predicates:
                - Path=/eureka/web
              filters:
                - SetPath=/

            - id: eureka-server-ui-assets
              uri: http://localhost:8761
              predicates:
                - Path=/eureka/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    registerWithEureka: true
    fetchRegistry: true